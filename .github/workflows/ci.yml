name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes
      - name: Линтер
        run: python -m pyflakes agent/ tests/
      - name: Тесты
        run: python -m pytest -q
      - name: Проверка готовности (без секретов — только структура)
        # В CI готовности нет по определению (нет .env и ключей), поэтому код
        # возврата не проверяем, а проверяем структуру отчёта. Раньше здесь стоял
        # `... ; test -s readiness.json`, и шаг падал на set -e ещё до test.
        run: |
          python -m agent.main проверка --json > readiness.json || true
          python - <<'PY'
          import json
          data = json.load(open("readiness.json", encoding="utf-8"))
          checks = data.get("checks") or []
          assert checks, "отчёт готовности пуст — команда сломалась"
          print(f"проверок: {len(checks)}, блокеров: {len(data.get('blockers') or [])}")
          asserts = data.get("next_actions")
          assert isinstance(asserts, list), "нет списка действий"
          PY
      - name: Проверка, что CLI отвечает на русские команды
        run: |
          python -m agent.main направления
          python -m agent.main входящие --limit 3
          python -m agent.main правила
          python -m agent.main площадка статус || true
      - name: Ключ площадки не нужен для проверки адреса кошелька
        run: python -m agent.main кошелёк 0x42C7377430A1E888de244fe167059dFD44988a3c
      - name: Доступность площадки агентов с раннера
        # В песочнице разработки домен закрыт, а на раннере GitHub интернет
        # открытый — от этого зависит, где живёт цикл площадки. Результат
        # печатается и попадает в аннотацию, чтобы его можно было прочитать
        # через API, не скачивая логи.
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 25 \
            https://www.agenthansa.com/api/agents/me 2>/dev/null || echo 000)
          echo "AgentHansa HTTP $code"
          case "$code" in
            000) echo "::warning::AgentHansa недоступна с раннера (код 000)";;
            401|200) echo "::notice::AgentHansa доступна с раннера (код $code), цикл площадки можно вести в Actions";;
            *) echo "::warning::AgentHansa ответила кодом $code";;
          esac
      - name: Доступность Taskmarket с раннера
        # Второй площадке ключ не нужен, но нужен доступ к домену: если и он
        # закрыт с раннера, задачи придётся снимать откуда-то ещё.
        run: |
          code=$(curl -sS -o /tmp/taskmarket.html -w "%{http_code}" -m 25 \
            https://taskmarket.dev/tasks 2>/dev/null || echo 000)
          echo "Taskmarket HTTP $code"
          case "$code" in
            200) echo "::notice::Taskmarket доступен с раннера (код 200), задачи можно снимать отчётом";;
            000) echo "::warning::Taskmarket недоступен с раннера (код 000)";;
            *) echo "::warning::Taskmarket ответил кодом $code";;
          esac
          python -m agent.main снапшот taskmarket --limit 20 || true
