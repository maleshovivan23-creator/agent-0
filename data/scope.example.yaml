# Пример файла авторизации для канала bug_recon.
# Пока этот файл не заполнен, воркер разведки не запускается (fail-closed).
#
# Правила простые: сюда попадают только те хосты, которые вы имеете право
# тестировать по опубликованным правилам программы. Активное тестирование
# разрешено только там, где программа его явно разрешает.

authorization:
  # Кто именно авторизовал работу — вы сами как участник программы.
  authorized_by: "ваше имя или ник на платформе"
  # Ссылка на страницу программы с правилами. Обязательна.
  program_url: "https://example.com/program-policy"
  # Дата, когда вы прочитали правила и убедились, что автоматизация разрешена.
  acknowledged_on: "2026-01-01"

# Пассивный режим: DNS, TLS-сертификат, HTTP-заголовки. Без полезной нагрузки.
passive_only: true
rate_limit_seconds: 3

targets:
  - host: "example.com"
    program: "Example Corp bug bounty"
    notes: "разрешён пассивный сбор данных"
