# Публичные настройки оператора: что потерять нельзя, а секретом не является.
#
# Здесь лежат только те значения, которые можно показывать кому угодно: адрес
# кошелька — публичные данные, страна нужна для выбора канала выплаты. Приватный
# ключ или seed-фраза сюда НЕ попадают никогда: ферма их не хранит и не просит.
#
# Файл в git специально: .env и база живут вне репозитория и исчезают вместе с
# окружением, а эти настройки должны пережить перезапуск среды и переезд на
# другую машину. Значения из окружения и .env всегда сильнее этих.

# Общий кошелёк фермы (Phantom, EVM-адрес: Ethereum, Base, Polygon, Arbitrum).
payout_wallet: "0x42C7377430A1E888de244fe167059dFD44988a3c"

# Кошелёк, привязанный к Taskmarket: им подписывается отправка работы, если
# площадка требует, чтобы заявление и подпись шли одним и тем же адресом.
taskmarket_wallet: "0x6E16fF195d8bbA5628F169BdFb3644655Ba2a8A8"

# Страна получения денег: определяет доступные каналы выплаты (карта, Stripe,
# крипта). Меняется свободно — это подсказка ферме, а не юридический факт.
country: "DE"
