# Вариант в контейнере: один сервис-робот + дашборд, состояние на volume.
services:
  autopilot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m agent.main autopilot
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "agent.main", "autopilot", "--status"]
      interval: 5m
      timeout: 60s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m agent.main serve --host 0.0.0.0 --port 8000
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 1m
      timeout: 15s
      retries: 3
